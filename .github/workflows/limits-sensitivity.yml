name: Independent ATR Limit Sensitivity
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/limits_sensitivity.py'
      - '.github/workflows/limits-sensitivity.yml'
permissions:
  contents: read
concurrency:
  group: research-atr-limit-validation
  cancel-in-progress: true
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research scripts only
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical no-lookahead / order execution
        run: python -m unittest discover -s research -p 'test_*.py' -v
      - name: Evaluate predetermined 20 combinations on train and unseen holdout
        run: python -u research/limits_sensitivity.py | tee research/limits_sensitivity_output.log
      - name: Publish full threshold study data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bottleneck-Lab-ATR-Sensitivity-Train-OOS
          path: |
            research/limits_results/
            research/limits_sensitivity_output.log
          if-no-files-found: warn
          retention-days: 90
