name: Scientific Long-Horizon Factor Robustness Study
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/robust_factors_1965_2026.py'
      - '.github/workflows/scientific-factor-study.yml'
permissions:
  contents: read
concurrency:
  group: scientific-factor-study
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific factor portfolio robustness experiment
        run: |
          set -o pipefail
          python -u research/robust_factors_1965_2026.py | tee research/scientific_factor_output.log
      - name: Archive full academic factor comparison data and sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Academic-Long-Horizon-Factor-Study
          path: |
            research/factor_robustness/
            research/scientific_factor_output.log
          if-no-files-found: warn
          retention-days: 90
