name: Research · Strategy audit 2026-11 (research only)
# Loads public research data once, freezes it on a data branch and runs the archived study code.
# Never touches the app or GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: ['research/strategy-audit-**']
    paths:
      - 'research/tests/2026-11-14-strategy-audit/files/code/**'
      - 'research/tests/2026-11-14-strategy-audit/files/protocol.md'
      - '.github/workflows/research-strategy-audit.yml'
permissions:
  contents: write   # only to commit inputs/results to the data branch below
concurrency:
  group: research-strategy-audit
  cancel-in-progress: true
env:
  STUDY: research/tests/2026-11-14-strategy-audit/files
  DATA_BRANCH: research-data/2026-11-14-strategy-audit
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned packages
        run: python -m pip install -r "$STUDY/requirements.txt"
      - name: Unit tests of the research library
        run: python -m unittest discover -s "$STUDY/code" -p 'test_*.py' -v
      - name: Frozen inputs (downloaded once, afterwards the data branch is reused)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$RUNNER_TEMP/data" FETCH_HEAD
            echo "Reusing frozen inputs from $(git -C "$RUNNER_TEMP/data" rev-parse HEAD)"
          else
            python "$STUDY/code/fetch_data.py" --out "$RUNNER_TEMP/raw"
            git worktree add --detach "$RUNNER_TEMP/data"
            cd "$RUNNER_TEMP/data"
            git checkout -q --orphan "$DATA_BRANCH"
            git rm -rfq .
            python "$GITHUB_WORKSPACE/$STUDY/code/prepare_inputs.py" --raw "$RUNNER_TEMP/raw" --out inputs
            git add -A inputs
            git commit -q -m "Frozen inputs of the strategy audit (code $GITHUB_SHA)"
            git push -q origin "HEAD:refs/heads/$DATA_BRANCH"
          fi
          # exploratory supplement (declared after the main results): loaded once, then reused
          if [ ! -f "$RUNNER_TEMP/data/supplement/sec_frames.parquet" ] && [ -f "$GITHUB_WORKSPACE/$STUDY/code/fetch_supplement.py" ]; then
            cd "$RUNNER_TEMP/data"
            python "$GITHUB_WORKSPACE/$STUDY/code/fetch_supplement.py" --out supplement
            git add -A supplement
            git commit -q -m "Exploratory supplement inputs (code $GITHUB_SHA)" || true
            git push -q origin "HEAD:refs/heads/$DATA_BRANCH"
            cd "$GITHUB_WORKSPACE"
          fi
      - name: Run the study
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/data/results"
          rm -rf "$OUT" && mkdir -p "$OUT"
          echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID inputs=$(git -C "$RUNNER_TEMP/data" log -1 --format=%H -- inputs)" > "$OUT/code_identity.txt"
          sha256sum "$STUDY"/code/*.py "$STUDY/protocol.md" "$STUDY/requirements.txt" >> "$OUT/code_identity.txt"
          if [ -f "$STUDY/code/run_all.py" ]; then
            python -u "$STUDY/code/run_all.py" --data "$RUNNER_TEMP/data/inputs" --supplement "$RUNNER_TEMP/data/supplement" --out "$OUT" 2>&1 | tee "$OUT/run.log"
          fi
      - name: Commit results to the data branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/data"
          git add -A results
          git commit -q -m "Results of run $GITHUB_RUN_ID (code $GITHUB_SHA)" || echo "nothing to commit"
          git push -q origin "HEAD:refs/heads/$DATA_BRANCH"
          git log --oneline | head -3
