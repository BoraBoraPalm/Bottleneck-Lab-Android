name: Independent 12-2 Momentum Historical Comparison
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/compare_momentum_12_2.py'
      - '.github/workflows/momentum-compare.yml'
permissions:
  contents: read
concurrency:
  group: momentum-12-2-study
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no-lookahead trade fills and stop gap pricing
        run: python -m unittest discover -s research -p 'test_*.py' -v
      - name: Evaluate 320 preselected dates with historical EUR conversion and fees
        run: |
          set -o pipefail
          python -u research/compare_momentum_12_2.py | tee research/momentum_comparison_output.log
      - name: Retain audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Historical-Momentum-12-2-Comparison
          path: |
            research/momentum_results/
            research/momentum_comparison_output.log
          if-no-files-found: warn
          retention-days: 90
